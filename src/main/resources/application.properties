# ============================================================================
# CẤU HÌNH HỆ THỐNG QUẢN LÝ CHUỖI CỬA HÀNG SÁCH CŨ
# ============================================================================
spring.application.name=BookstoreChainManagement

# Server Port
server.port=${PORT:8080}
server.servlet.context-path=/

# Microsoft SQL Server / Cloud MySQL (Aiven) Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=BookstoreChainDB;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234@abc}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# HikariCP Keep-Alive (Giữ kết nối CSDL Cloud Aiven luôn hoạt động, tránh timeout / idle shutdown)
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.SQLServerDialect}
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart / File Upload Settings (for Cloudinary upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Cloudinary Credentials (Cloud Storage for Book Covers & Condition Images)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dhpbqf4l}
cloudinary.api_key=${CLOUDINARY_API_KEY:862384428785567}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:EMpJOK-Lh-8IYfS_PeJPJ-D4Iz4}

# JWT Secret & Expiration
jwt.secret=9a3b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b
jwt.expiration-ms=86400000

# Logging
logging.level.com.bookstore=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================================
# CẤU HÌNH GỬI EMAIL SMTP GMAIL (OTP)
# ============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:book4lifeute@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mbbejaerdvwomiei}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# ============================================================================
# CẤU HÌNH TRỢ LÝ ẢO AI CSKH (GEMINI / OPENAI)
# ============================================================================
support.hotline.email=${SUPPORT_HOTLINE_EMAIL:book4lifeute@gmail.com}
ai.mode=rule-based
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-flash-latest

# ============================================================================
# TỐI ƯU HIỆU NĂNG & TỐC ĐỘ MIỄN PHÍ (PERFORMANCE OPTIMIZATIONS)
# ============================================================================
# 1. Gzip Compression (Nén giảm 70-85% dung lượng HTML, CSS, JS, JSON tải về)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. Browser Static Resource Caching (Lưu đệm CSS, JS, ảnh trên trình duyệt 7 ngày)
spring.web.resources.chain.cache=true
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# 3. Server Keep-Alive Self Ping (Tự động ping mỗi 12 phút chống ngủ đông trên Render)
app.keep-alive.url=${APP_KEEP_ALIVE_URL:https://book4life-store.onrender.com/api/ping}
