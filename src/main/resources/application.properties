# ============================================================================
# CẤU HÌNH HỆ THỐNG QUẢN LÝ CHUỖI CỬA HÀNG SÁCH CŨ
# ============================================================================
spring.application.name=BookstoreChainManagement

# Server Port
server.port=${PORT:8080}
server.servlet.context-path=/

# Microsoft SQL Server Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=BookstoreChainDB;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234@abc}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.SQLServerDialect}
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart / File Upload Settings (for Cloudinary upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Cloudinary Credentials (Placeholder / Local Config)
cloudinary.cloud_name=antigravity-books
cloudinary.api_key=123456789012345
cloudinary.api_secret=your_cloudinary_api_secret

# JWT Secret & Expiration
jwt.secret=9a3b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b
jwt.expiration-ms=86400000

# Logging
logging.level.com.bookstore=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================================
# CẤU HÌNH GỬI EMAIL SMTP GMAIL (OTP)
# ============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:book4lifeute@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mbbejaerdvwomiei}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================================
# CẤU HÌNH TRỢ LÝ ẢO AI CSKH (GEMINI / OPENAI)
# ============================================================================
support.hotline.email=${SUPPORT_HOTLINE_EMAIL:book4lifeute@gmail.com}
ai.mode=rule-based
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-flash-latest


