<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(
        pageTitle=${isEdit} ? 'Chỉnh Sửa Đầu Sách' : 'Thêm Mới Đầu Sách',
        pageSubtitle='Quản lý thông tin đầu sách để nhân viên chi nhánh nhập kho chính xác',
        content=~{::section}
      )}">
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="content-card">
                <div class="content-card-header">
                    <h5 class="fw-bold mb-0 text-primary d-flex align-items-center gap-2">
                        <i th:class="${isEdit} ? 'fas fa-pen-to-square' : 'fas fa-plus-circle'"></i>
                        <span th:text="${isEdit} ? 'Chỉnh Sửa Đầu Sách: ' + ${bookDto.title} : 'Thêm Mới Đầu Sách'">Thêm Đầu Sách</span>
                    </h5>
                    <a th:href="@{/admin/books}" class="btn btn-secondary-custom btn-sm">
                        <i class="fas fa-arrow-left me-1"></i> Quay lại Danh sách
                    </a>
                </div>

                <div class="content-card-body">
                    <form th:action="${isEdit} ? @{/admin/books/edit/{id}(id=${bookDto.id})} : @{/admin/books/create}"
                          th:object="${bookDto}" method="post">

                        <input type="hidden" id="bookIdInput" th:if="${isEdit}" th:field="*{id}">

                        <div class="row g-4">
                            <!-- Left Column: Primary Details -->
                            <div class="col-md-8">
                                <!-- Book Title -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên Đầu Sách <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{title}"
                                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                           placeholder="Ví dụ: Tôi Thấy Hoa Vàng Trên Cỏ Xanh">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                </div>

                                <!-- ISBN & Category Row -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">
                                            Mã ISBN-10 / ISBN-13 <span class="text-danger">*</span>
                                        </label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                                            <input type="text" id="isbnInput" class="form-control" th:field="*{isbn}"
                                                   th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid' : ''"
                                                   placeholder="Ví dụ: 9786041180010">
                                        </div>
                                        <div id="isbnFeedback" class="form-text mt-1" style="font-size: 0.8rem;">
                                            <span class="text-muted"><i class="fas fa-info-circle me-1"></i>Hệ thống tự động kiểm tra trùng lặp ISBN khi bạn nhập.</span>
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Thể Loại Sách <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{categoryId}"
                                                th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                            <option value="">-- Chọn Thể Loại --</option>
                                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                                    </div>
                                </div>

                                <!-- Author & Original Price Row -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Tác Giả <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{authorId}"
                                                th:classappend="${#fields.hasErrors('authorId')} ? 'is-invalid' : ''">
                                            <option value="">-- Chọn Tác Giả --</option>
                                            <option th:each="au : ${authors}" th:value="${au.id}" th:text="${au.name}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Giá Bìa Niêm Yết (VNĐ) <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="number" step="1000" class="form-control" th:field="*{originalPrice}"
                                                   th:classappend="${#fields.hasErrors('originalPrice')} ? 'is-invalid' : ''"
                                                   placeholder="Ví dụ: 125000">
                                            <span class="input-group-text">₫</span>
                                        </div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('originalPrice')}" th:errors="*{originalPrice}"></div>
                                    </div>
                                </div>

                                <!-- Publisher & Publish Year Row -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Nhà Xuất Bản</label>
                                        <input type="text" class="form-control" th:field="*{publisher}"
                                               placeholder="Ví dụ: NXB Trẻ, NXB Kim Đồng...">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Năm Xuất Bản</label>
                                        <input type="number" class="form-control" th:field="*{publishYear}"
                                               placeholder="Ví dụ: 2023">
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Tóm Tắt & Mô Tả Nội Dung</label>
                                    <textarea class="form-control" th:field="*{description}" rows="4"
                                              placeholder="Nhập tóm tắt tác phẩm, giải thưởng hoặc thông tin giới thiệu sách..."></textarea>
                                </div>
                            </div>

                            <!-- Right Column: Cover Image & Preview -->
                            <div class="col-md-4">
                                <div class="card border bg-light p-3 rounded-3 text-center">
                                    <label class="form-label fw-bold text-dark mb-2">
                                        <i class="fas fa-image text-primary me-1"></i> Ảnh Bìa Tiêu Chuẩn
                                    </label>
                                    
                                    <div class="mb-3 text-center">
                                        <img id="coverPreviewImg"
                                             th:src="${bookDto.coverImageUrl} ?: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300&q=80'"
                                             alt="Xem trước ảnh bìa"
                                             style="max-width: 180px; height: 250px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);"
                                             onerror="this.src='https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300&q=80'">
                                    </div>

                                    <div class="mb-2 text-start">
                                        <label class="form-label small fw-semibold">Đường dẫn ảnh bìa (Cloudinary / URL)</label>
                                        <input type="url" id="coverImageUrlInput" class="form-control form-control-sm"
                                               th:field="*{coverImageUrl}"
                                               placeholder="https://res.cloudinary.com/... hoặc link ảnh">
                                    </div>

                                    <p class="text-muted small mb-0 mt-2 text-start">
                                        <i class="fas fa-lightbulb text-warning me-1"></i>
                                        Ảnh bìa Master được dùng làm ảnh đại diện mặc định trên website toàn chuỗi.
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex align-items-center justify-content-end gap-3 mt-4 pt-3 border-top">
                            <a th:href="@{/admin/books}" class="btn btn-light px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary-custom px-5">
                                <i class="fas fa-save me-1"></i>
                                <span th:text="${isEdit} ? 'Lưu Thay Đổi' : 'Tạo Đầu Sách'">Lưu Đầu Sách</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
