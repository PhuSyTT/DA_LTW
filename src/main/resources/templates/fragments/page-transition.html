<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="transitionStyles">
    <!-- Book4Life Modern Top Loading Bar -->
    <link th:href="@{/css/page-transition.css}" href="/css/page-transition.css" rel="stylesheet"/>
</head>
<body>

<!-- Book4Life Top Loading Bar (Modern, Non-blocking, YouTube/GitHub style) -->
<div th:fragment="transitionOverlay" id="page-transition-overlay" class="b4l-top-loader" aria-hidden="true">
    <div class="b4l-top-loader-bar"></div>
</div>

<!-- Book4Life Transition Script Fragment -->
<th:block th:fragment="transitionScripts">
    <script th:src="@{/js/page-transition.js}" src="/js/page-transition.js"></script>
</th:block>

</body>
</html>
