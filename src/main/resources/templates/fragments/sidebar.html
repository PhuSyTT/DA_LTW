<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="app-sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
            <i class="fas fa-book-bookmark text-white"></i>
        </div>
        <div class="sidebar-brand-text">
            <h5>OldBooks HQ</h5>
            <span>Quản trị Chuỗi Sách Cũ</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-title">Quản Lý Kho (MDM)</div>
        <a th:href="@{/admin/books}" class="sidebar-link" th:classappend="${activeMenu == 'books'} ? 'active' : ''">
            <i class="fas fa-book"></i>
            <span>Đầu Sách Master</span>
        </a>
        <a th:href="@{/admin/authors}" class="sidebar-link" th:classappend="${activeMenu == 'authors'} ? 'active' : ''">
            <i class="fas fa-feather-pointed"></i>
            <span>Tác Giả</span>
        </a>
        <a th:href="@{/admin/categories}" class="sidebar-link" th:classappend="${activeMenu == 'categories'} ? 'active' : ''">
            <i class="fas fa-layer-group"></i>
            <span>Thể Loại Sách</span>
        </a>

        <div class="nav-section-title mt-3">Vận Hành & Chi Nhánh</div>
        <a th:href="@{/admin/inventory}" class="sidebar-link" th:classappend="${activeMenu == 'inventory'} ? 'active' : ''">
            <i class="fas fa-boxes-stacked"></i>
            <span>Tồn Kho Chi Nhánh <span class="badge bg-warning text-dark ms-auto" style="font-size: 0.65rem;">N2</span></span>
        </a>
        <a href="javascript:void(0)" class="sidebar-link text-muted" title="Sắp phát triển ở Nhóm 3,4">
            <i class="fas fa-truck-ramp-box"></i>
            <span>Đơn Hàng Phân Bổ <span class="badge bg-secondary ms-auto" style="font-size: 0.65rem;">N3</span></span>
        </a>
        <a href="javascript:void(0)" class="sidebar-link text-muted" title="Sắp phát triển ở Nhóm 5">
            <i class="fas fa-dolly"></i>
            <span>Luân Chuyển Kho <span class="badge bg-secondary ms-auto" style="font-size: 0.65rem;">N5</span></span>
        </a>
        <a href="javascript:void(0)" class="sidebar-link text-muted" title="Sắp phát triển ở Nhóm 8">
            <i class="fas fa-hand-holding-dollar"></i>
            <span>Thu Mua Sách Cũ <span class="badge bg-secondary ms-auto" style="font-size: 0.65rem;">N8</span></span>
        </a>

        <div class="nav-section-title mt-3">Hệ Thống</div>
        <a th:href="@{/admin/users}" class="sidebar-link" th:classappend="${activeMenu == 'users'} ? 'active' : ''">
            <i class="fas fa-users-gear"></i>
            <span>Tài Khoản & Quyền</span>
        </a>
    </nav>
</aside>
</body>
</html>
