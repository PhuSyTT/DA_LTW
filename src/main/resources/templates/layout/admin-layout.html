<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:fragment="html(pageTitle, pageSubtitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ? ${pageTitle} + ' - Bookstore Chain HQ' : 'Quản trị Chuỗi Sách Cũ'">Bookstore Chain HQ</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 (Primary & JSDelivr Mirror) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Cropper.js CSS for Book Cover and Image Cropping -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <!-- Custom Admin Styles -->
    <link th:href="@{/css/admin-styles.css}" rel="stylesheet">
    <!-- Page Transition Styles -->
    <th:block th:replace="~{fragments/page-transition :: transitionStyles}"></th:block>
    <style>
        body, input, button, select, textarea, optgroup, p, span, h1, h2, h3, h4, h5, h6, a, label, table, th, td, div {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Protect and ensure Font Awesome 6 icon rendering */
        .fa, .fas, .far, .fab, .fa-solid, .fa-regular, .fa-brands,
        .fa::before, .fas::before, .far::before, .fab::before,
        .fa-solid::before, .fa-regular::before, .fa-brands::before,
        [class*="fa-"]::before {
            display: inline-block;
            font-style: normal !important;
            font-variant: normal !important;
            text-rendering: auto !important;
            line-height: 1 !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .fa, .fas, .fa-solid,
        .fa::before, .fas::before, .fa-solid::before {
            font-family: 'Font Awesome 6 Free' !important;
            font-weight: 900 !important;
        }

        .far, .fa-regular,
        .far::before, .fa-regular::before {
            font-family: 'Font Awesome 6 Free' !important;
            font-weight: 400 !important;
        }

        .fab, .fa-brands,
        .fab::before, .fa-brands::before {
            font-family: 'Font Awesome 6 Brands' !important;
            font-weight: 400 !important;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
        }

        .bi {
            font-family: 'bootstrap-icons' !important;
        }
    </style>
</head>
<body>
<!-- Page Transition Overlay -->
<div th:replace="~{fragments/page-transition :: transitionOverlay}"></div>

<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content Container -->
    <div class="app-main">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Content Area -->
        <main class="app-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Specific Content Block -->
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Cropper.js JS for Book Cover Cropping -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<!-- Custom Master Data JS -->
<script th:src="@{/js/admin-master-data.js}"></script>
<!-- Page Transition Script -->
<th:block th:replace="~{fragments/page-transition :: transitionScripts}"></th:block>
</body>
</html>
