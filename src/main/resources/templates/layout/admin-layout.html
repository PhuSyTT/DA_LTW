<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:fragment="html(pageTitle, pageSubtitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ? ${pageTitle} + ' - Bookstore Chain HQ' : 'Quản trị Chuỗi Sách Cũ'">Bookstore Chain HQ</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 (Primary & JSDelivr Mirror) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Cropper.js CSS for Book Cover and Image Cropping -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <!-- Custom Admin Styles -->
    <link th:href="@{/css/admin-styles.css(v='2.2')}" rel="stylesheet">
    <!-- Page Transition Styles -->
    <th:block th:replace="~{fragments/page-transition :: transitionStyles}"></th:block>
    <style>
        .content-card-body {
            padding: 1.5rem !important;
        }
        @media (max-width: 575.98px) {
            .content-card-body {
                padding: 1rem !important;
            }
        }

        body, input, button, select, textarea, optgroup, p, span, h1, h2, h3, h4, h5, h6, a, label, table, th, td, div {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Protect and ensure Font Awesome 6 icon rendering */
        .fa, .fas, .far, .fab, .fa-solid, .fa-regular, .fa-brands,
        .fa::before, .fas::before, .far::before, .fab::before,
        .fa-solid::before, .fa-regular::before, .fa-brands::before,
        [class*="fa-"]::before {
            display: inline-block;
            font-style: normal !important;
            font-variant: normal !important;
            text-rendering: auto !important;
            line-height: 1 !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .fa, .fas, .fa-solid,
        .fa::before, .fas::before, .fa-solid::before {
            font-family: 'Font Awesome 6 Free' !important;
            font-weight: 900 !important;
        }

        .far, .fa-regular,
        .far::before, .fa-regular::before {
            font-family: 'Font Awesome 6 Free' !important;
            font-weight: 400 !important;
        }

        .fab, .fa-brands,
        .fab::before, .fa-brands::before {
            font-family: 'Font Awesome 6 Brands' !important;
            font-weight: 400 !important;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
        }

        .bi {
            font-family: 'bootstrap-icons' !important;
        }
    </style>
</head>
<body>
<!-- Page Transition Overlay -->
<div th:replace="~{fragments/page-transition :: transitionOverlay}"></div>

<div class="app-wrapper">
    <!-- Responsive Backdrop for Mobile Sidebar -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleAdminSidebar()"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content Container -->
    <div class="app-main">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Content Area -->
        <main class="app-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Specific Content Block -->
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Cropper.js JS for Book Cover Cropping -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<!-- Custom Master Data JS -->
<script th:src="@{/js/admin-master-data.js}"></script>
<!-- Real-time Notifications Floating Toast Container -->
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
    </div>
</div>

<!-- SockJS and STOMP.js for WebSocket Realtime Notifications -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const wsUserBranchId = /*[[${#authentication?.principal instanceof T(com.bookstore.security.CustomUserDetails) ? #authentication.principal.branchId : null}]]*/ null;
    const wsUserRole = /*[[${#authentication?.principal instanceof T(com.bookstore.security.CustomUserDetails) ? #authentication.principal.roleName : ''}]]*/ '';
    /*]]>*/

    // Web Audio API: Phát âm thanh chuông "ting-ting" trong trẻo
    function playChimeAlert() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            // Nốt 1: 880Hz (A5)
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(880, ctx.currentTime);
            gain1.gain.setValueAtTime(0.3, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(ctx.currentTime);
            osc1.stop(ctx.currentTime + 0.35);

            // Nốt 2: 1320Hz (E6) sau 100ms
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1320, ctx.currentTime + 0.1);
            gain2.gain.setValueAtTime(0.25, ctx.currentTime + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(ctx.currentTime + 0.1);
            osc2.stop(ctx.currentTime + 0.55);
        } catch (err) {
            console.warn("Chime alert error:", err);
        }
    }

    // Hiển thị Bootstrap Toast nổi góc phải
    function showRealtimeToast(title, bodyText, linkUrl, badgeColor = 'bg-primary') {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        const toastId = 'toast_' + Date.now();
        const toastEl = document.createElement('div');
        toastEl.className = 'toast border-0 shadow-lg mb-2';
        toastEl.id = toastId;
        toastEl.setAttribute('role', 'alert');
        toastEl.setAttribute('aria-live', 'assertive');
        toastEl.setAttribute('aria-atomic', 'true');
        toastEl.innerHTML = `
            <div class="toast-header ${badgeColor} text-white">
                <i class="fas fa-bell me-2"></i>
                <strong class="me-auto">${title}</strong>
                <small>Vừa xong</small>
                <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body bg-white text-dark p-3">
                <p class="mb-2 fw-semibold">${bodyText}</p>
                <a href="${linkUrl}" class="btn btn-sm btn-outline-primary fw-bold">Xem Chi Tiết &rarr;</a>
            </div>
        `;
        container.appendChild(toastEl);
        const bsToast = new bootstrap.Toast(toastEl, { delay: 8000 });
        bsToast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // Kết nối WebSocket STOMP
    function initWebSocketNotifications() {
        if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') return;

        try {
            const socket = new SockJS('/ws-bookstore');
            const stompClient = Stomp.over(socket);
            stompClient.debug = null; // tắt log debug console

            stompClient.connect({}, function (frame) {
                const isAdmin = wsUserRole.includes('ADMIN');

                // 1. Nhận thông báo đơn hàng mới
                if (isAdmin) {
                    stompClient.subscribe('/topic/admin/orders', function (message) {
                        const data = JSON.parse(message.body);
                        playChimeAlert();
                        showRealtimeToast('🔔 Đơn Hàng Mới Cần Xử Lý', data.message || ('Đơn #' + data.subOrderCode), '/admin/fulfillment', 'bg-primary');
                    });
                    stompClient.subscribe('/topic/admin/appraisals', function (message) {
                        const data = JSON.parse(message.body);
                        playChimeAlert();
                        showRealtimeToast('📖 Hồ Sơ Thẩm Định Thu Mua Mới', data.message || ('Hồ sơ #' + data.requestCode), '/admin/trade-in', 'bg-warning text-dark');
                    });
                }

                // 2. Nhân viên chi nhánh nhận thông báo theo chi nhánh của mình
                if (wsUserBranchId) {
                    stompClient.subscribe('/topic/branch/' + wsUserBranchId + '/orders', function (message) {
                        if (!isAdmin) {
                            const data = JSON.parse(message.body);
                            playChimeAlert();
                            showRealtimeToast('🔔 Đơn Hàng Mới Tại Chi Nhánh', data.message || ('Đơn #' + data.subOrderCode), '/admin/fulfillment', 'bg-primary');
                        }
                    });

                    stompClient.subscribe('/topic/branch/' + wsUserBranchId + '/appraisals', function (message) {
                        if (!isAdmin) {
                            const data = JSON.parse(message.body);
                            playChimeAlert();
                            showRealtimeToast('📖 Hồ Sơ Thu Mua Sách Mới', data.message || ('Hồ sơ #' + data.requestCode), '/admin/trade-in', 'bg-warning text-dark');
                        }
                    });
                }
            }, function (error) {
                // Tự động thử lại kết nối sau 10s nếu rớt
                setTimeout(initWebSocketNotifications, 10000);
            });
        } catch (e) {
            console.warn("WebSocket init error:", e);
        }
    }

    function toggleAdminSidebar() {
        const sidebar = document.querySelector('.app-sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        if (sidebar) {
            sidebar.classList.toggle('show');
            if (backdrop) backdrop.classList.toggle('show');
        }
    }

    document.addEventListener('DOMContentLoaded', initWebSocketNotifications);
</script>

<!-- Page Transition Script -->
<th:block th:replace="~{fragments/page-transition :: transitionScripts}"></th:block>
</body>
</html>
