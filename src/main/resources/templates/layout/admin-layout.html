<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:fragment="html(pageTitle, pageSubtitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ? ${pageTitle} + ' - Bookstore Chain HQ' : 'Quản trị Chuỗi Sách Cũ'">Bookstore Chain HQ</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom Admin Styles -->
    <link th:href="@{/css/admin-styles.css}" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content Container -->
    <div class="app-main">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Content Area -->
        <main class="app-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Specific Content Block -->
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom Master Data JS -->
<script th:src="@{/js/admin-master-data.js}"></script>
</body>
</html>
