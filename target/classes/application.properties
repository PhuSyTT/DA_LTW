# ============================================================================
# CẤU HÌNH HỆ THỐNG QUẢN LÝ CHUỖI CỬA HÀNG SÁCH CŨ
# ============================================================================
spring.application.name=BookstoreChainManagement

# Server Port
server.port=8080
server.servlet.context-path=/

# Microsoft SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BookstoreChainDB;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=1234@abc
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart / File Upload Settings (for Cloudinary upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Cloudinary Credentials (Placeholder / Local Config)
cloudinary.cloud_name=antigravity-books
cloudinary.api_key=123456789012345
cloudinary.api_secret=your_cloudinary_api_secret

# JWT Secret & Expiration
jwt.secret=9a3b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b
jwt.expiration-ms=86400000

# Logging
logging.level.com.bookstore=DEBUG
logging.level.org.hibernate.SQL=DEBUG
